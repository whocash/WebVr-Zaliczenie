<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Układ Słoneczny VR - Google Cardboard</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
        #ui-container {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 12, 22, 0.85); color: #e6edf3;
            padding: 20px; border-radius: 8px; border: 1px solid #30363d;
            font-family: sans-serif; max-width: 300px; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #58a6ff; font-size: 1.2rem; }
        .opis-item { margin-bottom: 5px; font-size: 0.9rem; color: #c9d1d9; }
    </style>

    <script>
        AFRAME.registerComponent('generator-gwiazd', {
            init: function () {
                const iloscGwiazd = 6200; 
                const scena = this.el;

                for (let i = 0; i < iloscGwiazd; i++) {
                    const gwiazda = document.createElement('a-sphere');
                    
                    const rozmiar = Math.random() * 0.10 + 0.01;
                    
                    const promienTla = Math.random() * 40 + 30; 
                    
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    
                    const x = promienTla * Math.sin(phi) * Math.cos(theta);
                    const y = promienTla * Math.sin(phi) * Math.sin(theta);
                    const z = promienTla * Math.cos(phi);

                    const jasnosc = Math.floor(Math.random() * 55) + 200; 
                    const kolor = `rgb(${jasnosc}, ${jasnosc}, 255)`;

                    gwiazda.setAttribute('radius', rozmiar);
                    gwiazda.setAttribute('position', `${x} ${y} ${z}`);
                    gwiazda.setAttribute('color', kolor);
                    gwiazda.setAttribute('shader', 'flat');

                    scena.appendChild(gwiazda);
                }
            }
        });
    </script>
</head>
<body>

    <div id="ui-container">
        <h2 id="ui-nazwa">Układ Słoneczny VR</h2>
        <div id="ui-opisy">
            <div class="opis-item">Skieruj celownik na planetę, aby pobrać informacje z bazy danych PostgreSQL przez API.</div>
        </div>
    </div>

    <a-scene generator-gwiazd>
        <a-sky color="#030308"></a-sky>

        <a-sphere id="sun" position="0 0 0" radius="3" color="#FFCC00" 
                  material="emissive: #FF9900; emissiveIntensity: 0.8">
        </a-sphere>

        <a-entity id="galaxy-container"></a-entity>

        <a-entity camera look-controls position="0 3 15">
            <a-cursor 
                id="cursor" 
                color="#00FF00" 
                position="0 0 -1"
                scale="1 1 1"
                animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
            </a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:3000';
        const galaxy = document.getElementById('galaxy-container');

        async function initSystem() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/planets`);
                const planety = await response.json();

                galaxy.innerHTML = '';

                planety.forEach((planeta) => {
                    const orbitRing = document.createElement('a-ring');
                    orbitRing.setAttribute('radius-inner', planeta.promienOrbity - 0.04);
                    orbitRing.setAttribute('radius-outer', planeta.promienOrbity + 0.04);
                    orbitRing.setAttribute('color', '#555566'); 
                    orbitRing.setAttribute('material', 'opacity: 0.4; transparent: true; side: double');
                    orbitRing.setAttribute('rotation', '-90 0 0'); 
                    orbitRing.setAttribute('position', '0 0 0'); 
                    orbitRing.setAttribute('shader', 'flat');
                    galaxy.appendChild(orbitRing);

                    const pivot = document.createElement('a-entity');
                    pivot.setAttribute('position', '0 0 0');
                    pivot.setAttribute('animation', `property: rotation; to: 0 360 0; loop: true; dur: ${planeta.predkosc}; easing: linear`);

                    const planetContainer = document.createElement('a-entity');
                    planetContainer.setAttribute('position', `0 0 -${planeta.promienOrbity}`);

                    const sphere = document.createElement('a-sphere');
                    sphere.setAttribute('id', planeta.id);
                    sphere.setAttribute('position', '0 0 0'); 
                    sphere.setAttribute('radius', planeta.rozmiar);
                    sphere.setAttribute('color', planeta.kolor);

                    sphere.addEventListener('mouseenter', () => {
                        sphere.setAttribute('animation__scale', 'property: scale; to: 1.25 1.25 1.25; dur: 200; easing: easeOutQuad');
                    });

                    sphere.addEventListener('mouseleave', () => {
                        sphere.setAttribute('animation__scale', 'property: scale; to: 1 1 1; dur: 200; easing: easeOutQuad');
                    });

                    sphere.addEventListener('click', async () => {
                        try {
                            const res = await fetch(`${BACKEND_URL}/api/planets/${planeta.id}/interact`, {
                                method: 'POST'
                            });
                            const data = await res.json();
                            
                            document.getElementById('ui-nazwa').innerText = data.nazwa;
                            document.getElementById('ui-opisy').innerHTML = `<div class="opis-item">✨ ${data.opis}</div>`;
                            
                        } catch (err) {
                            console.error("Błąd interakcji:", err);
                        }
                    });

                    planetContainer.appendChild(sphere);
                    pivot.appendChild(planetContainer);
                    galaxy.appendChild(pivot);
                });

            } catch (err) {
                console.error("Nie udało się załadować planet z backendu:", err);
            }
        }

        function usunPolskieZnaki(text) {
            return text
                .replace(/ą/g, 'a').replace(/Ć/g, 'C').replace(/ć/g, 'c')
                .replace(/ę/g, 'e').replace(/ł/g, 'l').replace(/ń/g, 'n')
                .replace(/ó/g, 'o').replace(/ś/g, 's').replace(/ź/g, 'z')
                .replace(/ż/g, 'z')
                .replace(/Ą/g, 'A').replace(/Ę/g, 'E').replace(/Ł/g, 'L')
                .replace(/Ń/g, 'N').replace(/Ó/g, 'O').replace(/Ś/g, 'S')
                .replace(/Ź/g, 'Z').replace(/Ż/g, 'Z');
        }

        initSystem();
    </script>
</body>
</html>
const BACKEND_URL = 'http://127.0.0.1:3000';
